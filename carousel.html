<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coding in a Flash</title>
    <meta name="author" content="Ricardo Nieves" />
    <meta
      name="description"
      content="Coding is a Flash, is an app to help students master fundamental concepts."
    />
    <meta
      name="keywords"
      content="study aids, flashcards, learning materials, study notes, study cards, memory cards"
    />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="normalize.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="page">
    <header class="header">
      <h1 class="header__title">
        <a class="header__link" href="#home">Flash Cards</a>
      </h1>
      <nav class="nav">
        <ul class="nav__links">
          <li>
            <a class="nav__link" href="#home">My Decks</a>
          </li>
          <li>
            <a class="nav__link" href="#about">About</a>
          </li>
        </ul>
      </nav>
    </header>
    <main class="page__main-content page__main-content--carousel">
      <section id="home" class="decks">
        <h2 class="decks__title">My Decks</h2>
        <div class="wrapping-row">
          <ul class="decks__list wrapping-row__display-contents"></ul>
          <template id="deck-template">
            <li class="deck deck_color_green">
              <a class="deck__link" href="#"></a>
              <h3 class="deck__title"></h3>
              <div class="deck__row">
                <p class="deck__count"></p>
                <button class="deck__delete-btn" type="button" aria-label="Delete this deck">
                 <img src="assets/images/delete.svg" alt="" />
                </button>
              </div>
           </li>
          </template>
          <button class="decks__new-decks-btn">+ New Deck</button>
        </div>
      </section>
      <section id="carousel" class="carousel">
        <h2 class="carousel__title">HTML Tags Deck &middot; 1/10</h2>
        <div class="carousel__card">
          <button class="carousel__btn carousel__btn_type_left carousel__btn_disabled" type="button" aria-label="Go to previous card in deck">
            <img src="assets/images/left.svg" alt=""/>
          </button>
          <p class="carousel__card-text">&lt;body&gt;&lt;/body&gt;</p>
          <button class="carousel__btn carousel__btn_type_right" type="button" aria-label="Go to next card in deck">
            <img src="assets/images/right.svg" alt=""/>
          </button>
          <button class="carousel__btn carousel__btn_type_flip" type="button" aria-label="Flip card in deck">
            <img src="assets/images/flip.svg" alt=""/>
          </button>
        </div>
      </section>
      <section id="about" class="hidden">
        <h2>About</h2>
      </section>
      <section id="not-found" class="view hidden">
        <h2>404 Not Found</h2>
        <p>The page you requested could not be found.</p>
      </section>
    </main>
    <footer class="footer">
      <p class="footer__text">&copy;2026 Ricardo Nieves</p>
    </footer>
  </body>
</html>
